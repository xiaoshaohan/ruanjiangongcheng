<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 学生成长与职业发展数据中台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(140deg, #0b1c33 0%, #123a6b 45%, #1a73e8 100%);
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
    }
    body::before, body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.45;
    }
    body::before { width: 420px; height: 420px; background: #2f7ef0; top: -140px; left: -100px; }
    body::after { width: 360px; height: 360px; background: #0d5bd6; bottom: -120px; right: -80px; }
    .login-box {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.98);
      width: 400px;
      padding: 42px 38px;
      border-radius: 16px;
      box-shadow: 0 18px 50px rgba(4, 20, 46, 0.35);
    }
    .brand { display: flex; flex-direction: column; align-items: center; margin-bottom: 26px; }
    .brand .logo {
      width: 46px; height: 46px; border-radius: 12px;
      background: linear-gradient(135deg, #2b81f0, #1557b0);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 14px;
      box-shadow: 0 6px 16px rgba(26,115,232,0.35);
    }
    .login-box h1 {
      font-size: 18px; color: #1a2233; font-weight: 600;
      text-align: center; margin-bottom: 6px; letter-spacing: 0.2px;
    }
    .login-box p.sub { font-size: 13px; color: #8b9aae; text-align: center; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; color: #5a6b82; margin-bottom: 7px; }
    .field input {
      width: 100%; padding: 11px 13px;
      border: 1px solid #d8dfe8; border-radius: 8px;
      font-size: 14px; font-family: inherit;
      background: #fbfcfd;
      transition: all 0.2s;
    }
    .field input:focus {
      outline: none; border-color: #1a73e8;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(26,115,232,0.1);
    }
    .btn-login {
      width: 100%; padding: 12px;
      background: linear-gradient(180deg, #2b81f0, #1a73e8);
      color: white; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 500; cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(26,115,232,0.3);
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-login:hover { background: linear-gradient(180deg, #1a73e8, #1557b0); box-shadow: 0 6px 16px rgba(26,115,232,0.38); }
    .btn-login:active { transform: translateY(1px); }
    .btn-login:disabled { background: #a9b8c9; box-shadow: none; cursor: not-allowed; }
    .error {
      background: #fff1f0; border: 1px solid #ffd6d9; color: #dc2626;
      padding: 10px 13px; border-radius: 8px; font-size: 13px;
      margin-bottom: 16px; display: none;
    }
    .hint { margin-top: 20px; font-size: 12px; color: #a3b0c1; text-align: center; }
  </style>
</head>
<body>

<div class="login-box">
  <div class="brand">
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
        <path d="M4 19V9M10 19V5M16 19v-7M22 19v-3"/>
      </svg>
    </div>
    <h1>学生成长与职业发展数据中台</h1>
    <p class="sub">请登录后使用管理功能</p>
  </div>

  <div class="error" id="error"></div>

  <form id="loginForm">
    <div class="field">
      <label>用户名</label>
      <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" required>
    </div>
    <div class="field">
      <label>密码</label>
      <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn-login" id="submitBtn">登 录</button>
  </form>

  <div class="hint">默认账号 admin / admin123</div>
</div>

<script>
// 已登录则直接进入系统
if (localStorage.getItem('token')) {
  location.href = '/';
}

const form = document.getElementById('loginForm');
const errorBox = document.getElementById('error');
const submitBtn = document.getElementById('submitBtn');

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.style.display = 'block';
}

form.onsubmit = async (e) => {
  e.preventDefault();
  errorBox.style.display = 'none';

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  if (!username || !password) {
    return showError('请输入用户名和密码');
  }

  submitBtn.disabled = true;
  submitBtn.textContent = '登录中...';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();

    if (data.code === 200 && data.data && data.data.token) {
      localStorage.setItem('token', data.data.token);
      localStorage.setItem('username', data.data.user.username);
      location.href = '/';
    } else {
      showError(data.message || '登录失败');
    }
  } catch (err) {
    showError('网络错误，请确认服务已启动');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = '登 录';
  }
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 学生成长与职业发展数据中台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(140deg, #0b1c33 0%, #123a6b 45%, #1a73e8 100%);
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
    }
    body::before, body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.45;
    }
    body::before { width: 420px; height: 420px; background: #2f7ef0; top: -140px; left: -100px; }
    body::after { width: 360px; height: 360px; background: #0d5bd6; bottom: -120px; right: -80px; }
    .box {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.98);
      width: 400px;
      padding: 42px 38px;
      border-radius: 16px;
      box-shadow: 0 18px 50px rgba(4, 20, 46, 0.35);
    }
    .brand { display: flex; flex-direction: column; align-items: center; margin-bottom: 26px; }
    .brand .logo {
      width: 46px; height: 46px; border-radius: 12px;
      background: linear-gradient(135deg, #2b81f0, #1557b0);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 14px;
      box-shadow: 0 6px 16px rgba(26,115,232,0.35);
    }
    .box h1 {
      font-size: 18px; color: #1a2233; font-weight: 600;
      text-align: center; margin-bottom: 6px; letter-spacing: 0.2px;
    }
    .box p.sub { font-size: 13px; color: #8b9aae; text-align: center; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; color: #5a6b82; margin-bottom: 7px; }
    .field input {
      width: 100%; padding: 11px 13px;
      border: 1px solid #d8dfe8; border-radius: 8px;
      font-size: 14px; font-family: inherit;
      background: #fbfcfd;
      transition: all 0.2s;
    }
    .field input:focus {
      outline: none; border-color: #1a73e8;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(26,115,232,0.1);
    }
    .identity { display: flex; gap: 10px; }
    .id-btn {
      flex: 1; padding: 9px 0;
      border: 1px solid #d8dfe8; background: #fbfcfd;
      border-radius: 8px; font-size: 14px; font-family: inherit;
      color: #5a6b82; cursor: pointer; transition: all 0.2s;
    }
    .id-btn.active {
      border-color: #1a73e8; background: #eaf2fe;
      color: #1a73e8; font-weight: 600;
    }
    .field .tip { font-size: 12px; color: #98a6b8; margin-top: 6px; line-height: 1.5; }
    .btn {
      width: 100%; padding: 12px;
      background: linear-gradient(180deg, #2b81f0, #1a73e8);
      color: white; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 500; cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(26,115,232,0.3);
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn:hover { background: linear-gradient(180deg, #1a73e8, #1557b0); box-shadow: 0 6px 16px rgba(26,115,232,0.38); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { background: #a9b8c9; box-shadow: none; cursor: not-allowed; }
    .error {
      background: #fff1f0; border: 1px solid #ffd6d9; color: #dc2626;
      padding: 10px 13px; border-radius: 8px; font-size: 13px;
      margin-bottom: 16px; display: none;
    }
    .success {
      background: #f0fdf4; border: 1px solid #bbf7d0; color: #16a34a;
      padding: 10px 13px; border-radius: 8px; font-size: 13px;
      margin-bottom: 16px; display: none;
    }
    .link { margin-top: 20px; font-size: 13px; color: #8b9aae; text-align: center; }
    .link a { color: #1a73e8; text-decoration: none; }
    .link a:hover { text-decoration: underline; }
    .notice {
      background: #f4f8ff; border: 1px solid #d6e4fb; color: #3a5a86;
      padding: 10px 13px; border-radius: 8px; font-size: 12.5px;
      line-height: 1.7; margin-bottom: 18px;
    }
  </style>
</head>
<body>

<div class="box">
  <div class="brand">
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
        <path d="M4 19V9M10 19V5M16 19v-7M22 19v-3"/>
      </svg>
    </div>
    <h1>注册账号</h1>
    <p class="sub">学生成长与职业发展数据中台</p>
  </div>

  <div class="error" id="error"></div>
  <div class="success" id="success"></div>

  <!-- R02：只开放学生自助注册，且必须"学号 + 姓名"与名单一致；教师账号由管理员开通 -->
  <div class="notice">
    仅支持学生自助注册。需填写<b>学号</b>和<b>姓名</b>，并与管理员导入的学生名单完全一致，否则无法注册。<br>
    教师账号请由管理员在用户管理中开通，注册教师身份会被拒绝。
  </div>

  <form id="regForm">
    <div class="field">
      <label>学号</label>
      <input type="text" id="identityNo" placeholder="请输入学号，如 2022001" autocomplete="off">
      <div class="tip">学号必须已在学生名单中，否则无法注册</div>
    </div>
    <div class="field">
      <label>姓名</label>
      <input type="text" id="realName" placeholder="请输入与学生名单一致的姓名" autocomplete="off">
      <div class="tip">姓名必须与学号对应的学生记录一致，用于身份核验</div>
    </div>
    <div class="field">
      <label>用户名</label>
      <input type="text" id="username" placeholder="3-50 个字符，字母或数字" autocomplete="username">
    </div>
    <div class="field">
      <label>密码</label>
      <input type="password" id="password" placeholder="至少 8 位，不能是纯重复数字" autocomplete="new-password">
    </div>
    <div class="field">
      <label>确认密码</label>
      <input type="password" id="confirm" placeholder="再次输入密码" autocomplete="new-password">
    </div>
    <button type="submit" class="btn" id="submitBtn">注 册</button>
  </form>

  <div class="link">已有账号？<a href="/login.html">返回登录</a></div>
</div>

<script>
const form = document.getElementById('regForm');
const errorBox = document.getElementById('error');
const successBox = document.getElementById('success');
const submitBtn = document.getElementById('submitBtn');

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.style.display = 'block';
  successBox.style.display = 'none';
}

form.onsubmit = async (e) => {
  e.preventDefault();
  errorBox.style.display = 'none';
  successBox.style.display = 'none';

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;
  const studentId = document.getElementById('identityNo').value.trim();
  const name = document.getElementById('realName').value.trim();

  if (!username || !password || !confirm) {
    return showError('请填写所有字段');
  }
  if (username.length < 3) {
    return showError('用户名至少 3 个字符');
  }
  if (password !== confirm) {
    return showError('两次输入的密码不一致');
  }
  // R37：密码策略与后端一致，至少 8 位
  if (password.length < 8) {
    return showError('密码至少 8 位');
  }
  if (/^(\d)\1+$/.test(password)) {
    return showError('密码不能是重复的数字');
  }
  if (!studentId) return showError('请填写学号');
  if (!name) return showError('请填写姓名，用于与学号核验');

  submitBtn.disabled = true;
  submitBtn.textContent = '注册中...';

  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: username.toLowerCase(),
        password,
        identity: 'student',
        student_id: studentId,
        name,
      }),
    });

    let data;
    try {
      data = await res.json();
    } catch (err) {
      showError('服务器返回格式异常（HTTP ' + res.status + '）');
      return;
    }

    if (data.code === 200) {
      successBox.textContent = '注册成功，2 秒后跳转到登录页';
      successBox.style.display = 'block';
      setTimeout(() => { location.href = '/login.html'; }, 2000);
    } else {
      // R08：直接展示后端给出的可读原因（学号不存在 / 姓名不匹配 / 用户名已占用）
      showError(data.message || '注册失败');
    }
  } catch (err) {
    showError('网络错误，请确认服务已启动');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = '注 册';
  }
};
</script>
</body>
</html>
